<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070c" />
    <meta name="description" content="PULSE — живой радар города: события, вайб и помощь рядом." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>PULSE — живой радар города</title>
  </head>
  <body>
    <script>try { var t = localStorage.getItem('pulse-theme-v2'); if (t === 'light' || t === 'dark') { document.documentElement.dataset.theme = t; document.documentElement.style.colorScheme = t; } else { document.documentElement.dataset.theme = 'dark'; document.documentElement.style.colorScheme = 'dark'; } } catch (e) {}</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
